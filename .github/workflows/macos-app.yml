name: macOS app

# Pull requests use ad-hoc limited development builds. Main and explicit manual runs produce
# Developer ID signed, notarized distribution builds. Native filtering acceptance
# still requires a real Mac; a CI build does not activate the extension.

on:
  push:
    branches: [main]
    paths:
      - "build.sh"
      - "desktop/macos/**"
      - "adapters/**"
      - "tests/browser-context/**"
      - "tests/fixtures/gmail-compose/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "tests/fixtures/screen-share/**"
      - "tests/fixtures/draft-evidence/**"
      - "tools/workflows/**"
      - "tools/evals/**"
      - "tests/test_*evals.py"
      - "docs/examples/synthetic-transfer/**"
      - "tests/test_workflow*.py"
      - "server/**"
      - "scripts/setup_model.py"
      - "tests/test_desktop.py"
      - "tests/test_review_reminder_boundary.py"
      - "tests/test_supply_chain.py"
      - "tests/test_package_*.py"
      - "tools/package_*.py"
      - "deploy/boxcop/**"
      - "tests/test_boxcop_deployment.py"
      - "tests/test_software_inventory.py"
      - "tests/test_feed_advisories.py"
      - "tests/test_feed_advisories_extended.py"
      - "tests/test_feed_advisories_remaining.py"
      - "tests/test_security_feed_review.py"
      - "scripts/security_feed_review.py"
      - "tests/test_classification_pipeline.py"
      - "tests/test_macos_packaging.py"
      - "tests/test_ci_signing.py"
      - "tests/test_release.py"
      - "tests/test_protected_bundle.py"
      - "tests/test_beta_scope.py"
      - "tests/test_scenario_*.py"
      - "tests/test_team_service.py"
      - "tests/test_team_reporting.py"
      - "tests/test_team_activity.py"
      - "tests/fixtures/interventions/**"
      - "requirements.txt"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "build.sh"
      - "desktop/macos/**"
      - "adapters/**"
      - "tests/browser-context/**"
      - "tests/fixtures/gmail-compose/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "tests/fixtures/screen-share/**"
      - "tests/fixtures/draft-evidence/**"
      - "tools/workflows/**"
      - "tools/evals/**"
      - "tests/test_*evals.py"
      - "docs/examples/synthetic-transfer/**"
      - "tests/test_workflow*.py"
      - "server/**"
      - "scripts/setup_model.py"
      - "tests/test_desktop.py"
      - "tests/test_review_reminder_boundary.py"
      - "tests/test_supply_chain.py"
      - "tests/test_package_*.py"
      - "tools/package_*.py"
      - "deploy/boxcop/**"
      - "tests/test_boxcop_deployment.py"
      - "tests/test_software_inventory.py"
      - "tests/test_feed_advisories.py"
      - "tests/test_feed_advisories_extended.py"
      - "tests/test_feed_advisories_remaining.py"
      - "tests/test_security_feed_review.py"
      - "scripts/security_feed_review.py"
      - "tests/test_classification_pipeline.py"
      - "tests/test_macos_packaging.py"
      - "tests/test_ci_signing.py"
      - "tests/test_release.py"
      - "tests/test_protected_bundle.py"
      - "tests/test_beta_scope.py"
      - "tests/test_scenario_*.py"
      - "tests/test_team_service.py"
      - "tests/test_team_reporting.py"
      - "tests/test_team_activity.py"
      - "tests/fixtures/interventions/**"
      - "requirements.txt"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable tests (Linux)
    runs-on: warp-ubuntu-2404-x64-4x
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - name: Sidecar and packaging tests
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv/bin/python -m pip install uv==0.11.6
          npm install --prefix "$RUNNER_TEMP/boxcop-package-clients" --ignore-scripts --no-audit --no-fund pnpm@11.24.0
          PATH="$RUNNER_TEMP/boxcop-package-clients/node_modules/.bin:$PWD/.venv/bin:$PATH" .venv/bin/python -m pytest -q tests/test_package_*.py tests/test_boxcop_deployment.py
          npm ci --prefix deploy/boxcop/website --ignore-scripts --no-audit --no-fund
          node --test deploy/boxcop/test/*.test.mjs
          env -u PYTHONPATH -u PYTHONHOME PYTHONDONTWRITEBYTECODE=1 \
            .venv/bin/python -m pytest -p no:cacheprovider -q tests/test_git_publication.py tests/test_reviewed_transfer.py tests/test_action_grants.py tests/test_effect_ledger.py tests/test_transaction_broker.py tests/test_completion_broker.py tests/test_upload_workflow.py tests/test_transfer_queue.py tests/test_desktop.py tests/test_macos_packaging.py tests/test_ci_signing.py tests/test_release.py tests/test_protected_bundle.py tests/test_beta_scope.py tests/test_scenario_qualification.py tests/test_scenario_readiness.py tests/test_live_vm_campaign.py tests/test_presentation_receiver_review.py tests/test_classification_pipeline.py tests/test_supply_chain.py tests/test_software_inventory.py tests/test_software_remediation.py tests/test_remediation_console.py tests/test_feed_advisories.py tests/test_feed_advisories_extended.py tests/test_feed_advisories_remaining.py tests/test_security_feed_review.py tests/test_team_service.py tests/test_team_reporting.py tests/test_team_activity.py
      - name: Offline workflow replay tests
        run: .venv/bin/python -m unittest discover -s tests -p 'test_workflow*.py'
      - name: Model evaluation harness tests (no model downloads or paid calls)
        run: python -m unittest discover -s tests -p 'test_*evals.py'
      - name: Browser collection tests
        run: node --test tests/browser-context/*.test.cjs
      - name: Review reminder packaging and policy boundary
        run: .venv/bin/python -m pytest -q tests/test_review_reminder_boundary.py tests/test_email_review.py
      - name: Gmail composition scenarios (synthetic, no Gmail connection)
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          web/node_modules/.bin/playwright install --with-deps chromium
          CHROME_PATH="$(node -p 'require("./web/node_modules/@playwright/test").chromium.executablePath()')" \
            node tests/browser-context/gmail-composition.browser.mjs
          CHROME_PATH="$(node -p 'require("./web/node_modules/@playwright/test").chromium.executablePath()')" \
            node --test tests/browser-context/email-review.browser.mjs
      - name: Agent hooks and egress boundary tests
        run: |
          .venv/bin/python -m pytest -q tests/test_agent_hooks.py tests/test_host_agents.py tests/test_human_review.py tests/test_communication_commands.py tests/test_team_desktop.py tests/test_host_agent_health.py tests/test_host_agent_verification.py tests/test_host_agent_acceptance.py tests/test_cursor_desktop_effects.py tests/test_host_agent_lifecycle.py tests/test_host_agent_faults.py tests/test_beta_interventions.py tests/test_broader_hooks.py tests/test_skill_security.py tests/test_agent_corrections.py
          node --test tests/agent-egress.test.cjs
      - name: Swift portable core (pinned official image, no network)
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/work" -w /work/desktop/macos \
            swift@sha256:73f569f5536fe3c9ad5109eb4622c5560af7424d55304955190e5fbccc047b86 swift test

  macos:
    name: BoxCop.app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: warp-macos-26-arm64-6x
            arch: arm64
          # Disabled: all CI runs on WarpBuild.
          # WarpBuild does not provide Intel macOS runners.
          # - runner: macos-15-intel
          #   arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          python3.12 --version
          command -v cmake >/dev/null || brew install cmake
          cmake --version
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Swift tests (streamed, 120 s deadline per run)
        run: bash desktop/macos/scripts/ci_swift_tests.sh 120 "$RUNNER_TEMP/out/swift-diagnostics"
      - name: Linked draft evidence replay (real source, native receiver, selector; synthetic text)
        run: |
          swift build --package-path desktop/macos --product DraftEvidenceReplay
          BOXCOP_DRAFT_REPLAY_REQUIRED=1 BOXCOP_DRAFT_REPLAY="$PWD/desktop/macos/.build/debug/DraftEvidenceReplay" \
            python3.12 -m unittest discover -s tests -p 'test_workflow_draft_evidence.py' -v
      - name: Install signing credentials
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BOXCOP_CERTIFICATE_BASE64: ${{ secrets.BOXCOP_CERTIFICATE_BASE64 }}
          BOXCOP_CERTIFICATE_PASSWORD: ${{ secrets.BOXCOP_CERTIFICATE_PASSWORD }}
          BOXCOP_APP_PROFILE_BASE64: ${{ secrets.BOXCOP_APP_PROFILE_BASE64 }}
          BOXCOP_NETWORK_PROFILE_BASE64: ${{ secrets.BOXCOP_NETWORK_PROFILE_BASE64 }}
          BOXCOP_NOTARY_APPLE_ID: ${{ secrets.BOXCOP_NOTARY_APPLE_ID }}
          BOXCOP_NOTARY_PASSWORD: ${{ secrets.BOXCOP_NOTARY_PASSWORD }}
        run: python3.12 desktop/macos/scripts/ci_signing.py install
      - name: Build signed and notarized distribution app
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BOXCOP_CHANNEL: beta
          BOXCOP_PACKAGE_FEED_URL: ${{ vars.BOXCOP_PACKAGE_FEED_URL }}
          BOXCOP_PACKAGE_FEED_PUBLIC_KEY_BASE64: ${{ vars.BOXCOP_PACKAGE_FEED_PUBLIC_KEY_BASE64 }}
          BOXCOP_PACKAGE_FEED_MINIMUM_SEQUENCE: ${{ vars.BOXCOP_PACKAGE_FEED_MINIMUM_SEQUENCE || '1' }}
        run: ./build.sh "$RUNNER_TEMP/out"
      - name: Build ad-hoc PR app
        if: github.event_name == 'pull_request'
        run: python3.12 desktop/macos/scripts/build_app.py --profile limited-development --output "$RUNNER_TEMP/out"
      - name: Bundle details
        run: |
          APP="$RUNNER_TEMP/out/BoxCop.app"
          {
            echo "== architectures"
            lipo -archs "$APP/Contents/MacOS/BoxCop"
            lipo -archs "$APP/Contents/Resources/engine/boxcop-engine"
            echo "== signature"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier|Runtime|Sealed Resources)' || true
            codesign --verify --deep --strict "$APP" && echo "codesign --verify --deep --strict: OK"
            echo "== Gatekeeper assessment (PR builds are ad-hoc; signed builds were strictly checked by build.sh)"
            spctl --assess --type execute -vv "$APP" 2>&1 || true
            echo "== sizes and digest"
            du -sh "$APP"
            shasum -a 256 "$RUNNER_TEMP/out/BoxCop.dmg"
          } | tee "$RUNNER_TEMP/out/bundle-details.txt"
      - name: Launch smoke (distribution opt-in behavior)
        run: bash desktop/macos/scripts/ci_launch_smoke.sh "$RUNNER_TEMP/out/BoxCop.app" "$RUNNER_TEMP/out"
      - name: Native interface screenshots (synthetic, collectors off)
        if: github.event_name == 'pull_request'
        run: '"$RUNNER_TEMP/out/BoxCop.app/Contents/MacOS/BoxCop" --dev-interface-preview "$RUNNER_TEMP/out/interface-preview"'
      - name: Remove signing credentials
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: python3.12 desktop/macos/scripts/ci_signing.py cleanup
      - name: Upload app and evidence
        if: always()
        # On pull requests the uploaded build is review evidence; the steps above are the
        # check. When the organization's artifact storage quota is used up, the upload fails
        # and its error stays in the run annotations, but the job result follows the build,
        # tests and launch smoke. Main and manual signed builds still fail without an upload.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BoxCop-macOS-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/out/BoxCop.dmg
            ${{ runner.temp }}/out/build-evidence.json
            ${{ runner.temp }}/out/BoxCop.dSYM/
            ${{ runner.temp }}/out/bundle-details.txt
            ${{ runner.temp }}/out/launch-smoke.txt
            ${{ runner.temp }}/out/first-run.png
            ${{ runner.temp }}/out/interface-preview/
            ${{ runner.temp }}/out/swift-diagnostics/
          if-no-files-found: warn
          # Pull request builds are short-lived review evidence; keep them briefly so the
          # organization artifact quota is not exhausted. Main and manual builds keep 30 days.
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
