name: Release BoxCop
run-name: Release BoxCop ${{ inputs.version || '(auto patch)' }} from main

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version (major.minor.patch); leave blank to bump the patch version'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: boxcop-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: warp-macos-26-arm64-6x
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate main and new version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3.12 desktop/macos/scripts/release.py prepare --version "$RELEASE_VERSION"
      - name: Refresh bundled threat-domain list
        # Ship the newest upstream snapshot; fail rather than release a stale or broken list.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3.12 desktop/macos/scripts/refresh_threat_domains.py --max-age-days 2
      - name: Toolchain and release regression tests
        run: |
          test "$(uname -m)" = arm64
          command -v cmake >/dev/null || brew install cmake
          python3.12 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pytest -q tests/test_macos_packaging.py tests/test_ci_signing.py tests/test_protected_bundle.py tests/test_release.py tests/test_threat_domain_refresh.py
      - name: Install signing credentials
        env:
          BOXCOP_CERTIFICATE_BASE64: ${{ secrets.BOXCOP_CERTIFICATE_BASE64 }}
          BOXCOP_CERTIFICATE_PASSWORD: ${{ secrets.BOXCOP_CERTIFICATE_PASSWORD }}
          BOXCOP_APP_PROFILE_BASE64: ${{ secrets.BOXCOP_APP_PROFILE_BASE64 }}
          BOXCOP_NETWORK_PROFILE_BASE64: ${{ secrets.BOXCOP_NETWORK_PROFILE_BASE64 }}
          BOXCOP_NOTARY_APPLE_ID: ${{ secrets.BOXCOP_NOTARY_APPLE_ID }}
          BOXCOP_NOTARY_PASSWORD: ${{ secrets.BOXCOP_NOTARY_PASSWORD }}
        run: python3.12 desktop/macos/scripts/ci_signing.py install
      - name: Build, test, sign and notarize
        env:
          BOXCOP_CHANNEL: beta
          BOXCOP_PACKAGE_FEED_URL: ${{ vars.BOXCOP_PACKAGE_FEED_URL }}
          BOXCOP_PACKAGE_FEED_PUBLIC_KEY_BASE64: ${{ vars.BOXCOP_PACKAGE_FEED_PUBLIC_KEY_BASE64 }}
          BOXCOP_PACKAGE_FEED_MINIMUM_SEQUENCE: ${{ vars.BOXCOP_PACKAGE_FEED_MINIMUM_SEQUENCE || '1' }}
        run: ./build.sh "$RUNNER_TEMP/out"
      - name: Verify packaged launch
        run: bash desktop/macos/scripts/ci_launch_smoke.sh "$RUNNER_TEMP/out/BoxCop.app" "$RUNNER_TEMP/out"
      - name: Sign update feed and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BOXCOP_SPARKLE_PRIVATE_KEY: ${{ secrets.BOXCOP_SPARKLE_PRIVATE_KEY }}
        run: .venv/bin/python desktop/macos/scripts/release.py publish --output "$RUNNER_TEMP/out"
      - name: Remove signing credentials
        if: always()
        run: python3.12 desktop/macos/scripts/ci_signing.py cleanup
      - name: Retain build evidence
        # A published release already carries the symbols zip, build-evidence.json and
        # launch-smoke.txt as release assets. Keep this artifact only to debug a failed
        # release, and never fail the run because Actions artifact storage is full.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BoxCop-release-evidence
          path: |
            ${{ runner.temp }}/out/build-evidence.json
            ${{ runner.temp }}/out/BoxCop.dSYM/
            ${{ runner.temp }}/out/launch-smoke.txt
          if-no-files-found: ignore
