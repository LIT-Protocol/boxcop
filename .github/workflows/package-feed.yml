name: Publish package malware feed

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      approve_digest:
        description: SHA-256 of a reviewed pending candidate (leave empty for normal refresh)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: official-package-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'LIT-Protocol/boxcop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore the latest publisher state
        run: |
          ref=refs/heads/package-feed
          previous=$(git ls-remote origin "$ref" | cut -f1)
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          directory="$RUNNER_TEMP/package-feed"
          echo "FEED_DIRECTORY=$directory" >> "$GITHUB_ENV"
          git worktree add --detach --no-checkout "$directory" HEAD
          if [[ -n "$previous" ]]; then
            git fetch --depth=1 origin "$ref"
            git -C "$directory" checkout --detach "$previous"
          else
            git -C "$directory" read-tree --empty
          fi
      - name: Restore interrupted ingestion
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/package-feed/ingest
          key: package-ingest-${{ env.PREVIOUS }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: package-ingest-${{ env.PREVIOUS }}-
      - name: Stage feed and promote eligible changes
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOXCOP_FEED_SIGNING_KEY_BASE64: ${{ secrets.BOXCOP_FEED_SIGNING_KEY_BASE64 }}
          APPROVE_DIGEST: ${{ inputs.approve_digest }}
        run: python -m tools.github_package_feed
      - name: Save checkpoints for retry after a source failure
        if: failure() && steps.refresh.outcome == 'failure'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/package-feed/ingest
          key: package-ingest-${{ env.PREVIOUS }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish snapshot and cursors atomically
        working-directory: ${{ env.FEED_DIRECTORY }}
        run: |
          git add -A
          tree=$(git write-tree)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(git commit-tree "$tree" -m 'Update package malware feed')
          git -C "$GITHUB_WORKSPACE" push --force-with-lease="refs/heads/package-feed:$PREVIOUS" origin "$commit:refs/heads/package-feed"
