name: Release BoxCop
run-name: Release BoxCop ${{ inputs.version || '(auto patch)' }} from main

# Manual only. Builds the Developer ID signed, notarized app with the network
# extension and publishes a GitHub release in LIT-Protocol/boxcop.
# Required secrets and variables are listed in docs/releasing.md. The first step
# stops with their names when any are missing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version (major.minor.patch); leave blank to bump the patch version'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: boxcop-release
  cancel-in-progress: false

env:
  # Update feed: explicit configuration, never a baked-in domain.
  BOXCOP_UPDATE_FEED_URL: ${{ vars.BOXCOP_UPDATE_FEED_URL }}
  BOXCOP_UPDATE_PUBLIC_KEY: ${{ vars.BOXCOP_UPDATE_PUBLIC_KEY }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check that signing and update configuration exists
        env:
          BOXCOP_CERTIFICATE_BASE64: ${{ secrets.BOXCOP_CERTIFICATE_BASE64 }}
          BOXCOP_CERTIFICATE_PASSWORD: ${{ secrets.BOXCOP_CERTIFICATE_PASSWORD }}
          BOXCOP_APP_PROFILE_BASE64: ${{ secrets.BOXCOP_APP_PROFILE_BASE64 }}
          BOXCOP_NETWORK_PROFILE_BASE64: ${{ secrets.BOXCOP_NETWORK_PROFILE_BASE64 }}
          BOXCOP_NOTARY_APPLE_ID: ${{ secrets.BOXCOP_NOTARY_APPLE_ID }}
          BOXCOP_NOTARY_PASSWORD: ${{ secrets.BOXCOP_NOTARY_PASSWORD }}
          BOXCOP_TEAM_ID: ${{ secrets.BOXCOP_TEAM_ID }}
          BOXCOP_SIGNING_IDENTITY: ${{ secrets.BOXCOP_SIGNING_IDENTITY }}
          BOXCOP_SPARKLE_PRIVATE_KEY: ${{ secrets.BOXCOP_SPARKLE_PRIVATE_KEY }}
        run: |
          python3.12 desktop/macos/scripts/ci_signing.py check
          missing=""
          [ -n "$BOXCOP_SPARKLE_PRIVATE_KEY" ] || missing="$missing BOXCOP_SPARKLE_PRIVATE_KEY(secret)"
          [ -n "$BOXCOP_UPDATE_FEED_URL" ] || missing="$missing BOXCOP_UPDATE_FEED_URL(variable)"
          [ -n "$BOXCOP_UPDATE_PUBLIC_KEY" ] || missing="$missing BOXCOP_UPDATE_PUBLIC_KEY(variable)"
          if [ -n "$missing" ]; then
            echo "::error title=Release is not configured::Missing:$missing. See docs/releasing.md."
            exit 1
          fi
      - name: Validate main and new version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv/bin/python desktop/macos/scripts/release.py prepare --version "$RELEASE_VERSION"
      - name: Refresh bundled threat-domain list
        # Ship the newest upstream snapshot; fail rather than release a stale or broken list.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3.12 desktop/macos/scripts/refresh_threat_domains.py --max-age-days 2
      - name: Toolchain and tests
        run: |
          test "$(uname -m)" = arm64
          command -v cmake >/dev/null || brew install cmake
          .venv/bin/python -m pytest -q tests
      - name: Install signing credentials
        env:
          BOXCOP_CERTIFICATE_BASE64: ${{ secrets.BOXCOP_CERTIFICATE_BASE64 }}
          BOXCOP_CERTIFICATE_PASSWORD: ${{ secrets.BOXCOP_CERTIFICATE_PASSWORD }}
          BOXCOP_APP_PROFILE_BASE64: ${{ secrets.BOXCOP_APP_PROFILE_BASE64 }}
          BOXCOP_NETWORK_PROFILE_BASE64: ${{ secrets.BOXCOP_NETWORK_PROFILE_BASE64 }}
          BOXCOP_NOTARY_APPLE_ID: ${{ secrets.BOXCOP_NOTARY_APPLE_ID }}
          BOXCOP_NOTARY_PASSWORD: ${{ secrets.BOXCOP_NOTARY_PASSWORD }}
          BOXCOP_TEAM_ID: ${{ secrets.BOXCOP_TEAM_ID }}
          BOXCOP_SIGNING_IDENTITY: ${{ secrets.BOXCOP_SIGNING_IDENTITY }}
        run: python3.12 desktop/macos/scripts/ci_signing.py install
      - name: Build, test, sign and notarize
        env:
          BOXCOP_CHANNEL: beta
          # Optional overrides. Unset, build.sh uses the existing signed Allay package feed.
          BOXCOP_PACKAGE_FEED_URL: ${{ vars.BOXCOP_PACKAGE_FEED_URL }}
          BOXCOP_PACKAGE_FEED_PUBLIC_KEY_BASE64: ${{ vars.BOXCOP_PACKAGE_FEED_PUBLIC_KEY_BASE64 }}
          BOXCOP_PACKAGE_FEED_MINIMUM_SEQUENCE: ${{ vars.BOXCOP_PACKAGE_FEED_MINIMUM_SEQUENCE }}
        run: ./build.sh "$RUNNER_TEMP/out"
      - name: Verify packaged launch
        run: bash desktop/macos/scripts/ci_launch_smoke.sh "$RUNNER_TEMP/out/BoxCop.app" "$RUNNER_TEMP/out"
      - name: Sign update feed and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BOXCOP_SPARKLE_PRIVATE_KEY: ${{ secrets.BOXCOP_SPARKLE_PRIVATE_KEY }}
        run: .venv/bin/python desktop/macos/scripts/release.py publish --output "$RUNNER_TEMP/out"
      - name: Remove signing credentials
        if: always()
        run: python3.12 desktop/macos/scripts/ci_signing.py cleanup
      - name: Retain build evidence from a failed release
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BoxCop-release-evidence
          path: |
            ${{ runner.temp }}/out/build-evidence.json
            ${{ runner.temp }}/out/BoxCop.dSYM/
            ${{ runner.temp }}/out/launch-smoke.txt
          if-no-files-found: ignore
